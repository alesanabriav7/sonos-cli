name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - name: Smoke test standalone executable
        run: |
          ./dist/sonosctl --version
          ./dist/sonosctl --compact capabilities | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (!result.ok || result.data.settings.length !== 24) process.exit(1);
            });
          '

